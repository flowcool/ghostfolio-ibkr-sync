name: Dependency release watch

# Opens one review issue per new stable release of a pinned dependency
# (requirements.txt on PyPI, supercronic on GitHub) so breaking changes are
# checked before Dependabot proposes the bump. Never changes pins or builds.
on:
  schedule:
    - cron: "29 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-release-watch
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Open review issues for new dependency releases
        run: python scripts/watch_dependency_releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
