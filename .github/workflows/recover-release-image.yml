name: Recover qualified release publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared stable draft tag, authorized by the maintainer
        required: true
        type: string
      digest:
        description: Exact qualified RC index digest
        required: true
        type: string
      previous_digest:
        description: Expected current latest digest and rollback target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify qualified RC and publish the prepared stable release without a build
        run: python scripts/recover_release_image.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.tag }}
          RECOVERY_DIGEST: ${{ inputs.digest }}
          RECOVERY_PREVIOUS_DIGEST: ${{ inputs.previous_digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qualified-release-recovery
          path: |
            tmp/recovery/*.json
            tmp/recovery/source/release-manifest*
          if-no-files-found: warn
