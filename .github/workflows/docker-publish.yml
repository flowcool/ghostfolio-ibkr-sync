name: Validate Docker image

on:
  push:
    branches:
      - main
      - staging
    tags:
      - "v*"
  # Every PR runs required checks, including documentation-only changes.
  pull_request:
    branches:
      - main
  # Manual validation uses the selected ref and never publishes.
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"  # same as the image base
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install runtime, development and audit dependencies
        run: pip install -r requirements-dev.txt
      - name: Audit the complete Python CI environment
        run: pip-audit

  container-check:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: sync-check:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Check isolated read-only runtime modes
        run: |
          docker load --input "${{ runner.temp }}/image.tar"
          # Trace the synthetic outputs and scheduled container logs for evidence.
          bash -x scripts/check_container_runtime.sh sync-check:ci
      # Blocking gate: fixable HIGH/CRITICAL in packages we can act on (base image
      # OS packages, plus our Python layer). The supercronic binary is excluded
      # here because its Go-stdlib CVEs are not fixable by us until upstream ships
      # a rebuilt release, and its code paths are unreachable in this image (local
      # cron only, no HTTP listener, no TLS client). It is covered by the advisory
      # scan below instead of blocking every PR. Python deps are also gated by
      # pip-audit in the dependency-audit job.
      - name: Scan image for fixable high and critical vulnerabilities (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-files: /usr/local/bin/supercronic
          trivyignores: .trivyignore
      # Advisory scan: reports every fixable HIGH/CRITICAL (including the
      # supercronic binary skipped above) for visibility, but never blocks the
      # merge. Runs even if the blocking scan failed.
      - name: Advisory vulnerability scan (never blocks)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
