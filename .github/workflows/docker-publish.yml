name: Validate Docker image

on:
  # main is validated on the PR before merge; no re-run after merge.
  push:
    branches:
      - staging
    tags:
      - "v*"
  # Every PR reports the required checks; documentation-only PRs skip the work.
  pull_request:
    branches:
      - main
  # Manual validation uses the selected ref and never publishes.
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Documentation-only PRs (docs/, openspec/, *.md) skip the dependency audit
  # and container steps; tests still run. Required checks still report
  # (skipped = success). Fails open: any scope error runs everything.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only || true)
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|openspec/)|\.md$'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Tests also check README, ADR and doc consistency: they run on every PR.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"  # same as the image base
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: scripts/check.sh
        env:
          PYTHON: python

  dependency-audit:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install runtime, development and audit dependencies
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Audit the complete Python CI environment
        run: pip-audit

  container-check:
    name: container-check (${{ matrix.arch }})
    # Matrix job names only expand when the job runs, so it always runs and
    # its steps are skipped for documentation-only PRs.
    needs: scope
    if: ${{ !cancelled() }}
    env:
      RUN_WORK: ${{ needs.scope.result != 'success' || needs.scope.outputs.code != 'false' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_WORK == 'true'
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: env.RUN_WORK == 'true'
      - name: Build without publishing
        if: env.RUN_WORK == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: sync-check:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Check isolated read-only runtime modes
        if: env.RUN_WORK == 'true'
        run: |
          docker load --input "${{ runner.temp }}/image.tar"
          # Trace the synthetic outputs and scheduled container logs for evidence.
          bash -x scripts/check_container_runtime.sh sync-check:ci
      # Blocking gate: fixable HIGH/CRITICAL in packages we can act on (base image
      # OS packages, plus our Python layer). The supercronic binary is excluded
      # here because its Go-stdlib CVEs are not fixable by us until upstream ships
      # a rebuilt release, and its code paths are unreachable in this image (local
      # cron only, no HTTP listener, no TLS client). It is covered by the advisory
      # scan below instead of blocking every PR. Python deps are also gated by
      # pip-audit in the dependency-audit job.
      - name: Scan image for fixable high and critical vulnerabilities (blocking)
        if: env.RUN_WORK == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-files: /usr/local/bin/supercronic
          trivyignores: .trivyignore
      # Advisory scan: reports every fixable HIGH/CRITICAL (including the
      # supercronic binary skipped above) for visibility, but never blocks the
      # merge. Runs even if the blocking scan failed.
      - name: Advisory vulnerability scan (never blocks)
        if: always() && env.RUN_WORK == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
