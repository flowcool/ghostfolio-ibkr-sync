name: CodeQL

on:
  # main is analyzed weekly; PRs are analyzed before merge (no re-run after merge).
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep required checks visible; uncertain scope runs the full check.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            # Include old paths so moving code into docs still runs full checks.
            # GitHub lists at most 3,000 changed files. A boundary result stays full.
            if files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'); then
              mapfile -t paths <<< "$files"
              if [ -n "$files" ] && [ "${#paths[@]}" -lt 3000 ]; then
                code=false
                for path in "${paths[@]}"; do
                  case "$path" in
                    docs/*|openspec/*|*.md|llms.txt) ;;
                    *) code=true; break ;;
                  esac
                done
              fi
            else
              echo "::warning::Changed files unavailable; running full validation"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  analyze:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
