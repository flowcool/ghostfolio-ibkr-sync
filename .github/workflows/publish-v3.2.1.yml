name: Publish v3.2.1 with maintainer lab waiver

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-v3.2.1-with-lab-waiver
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == 'flowcool' && inputs.confirm == 'publish-v3.2.1-with-lab-waiver'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the fixed signed security patch without further lab admission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, "scripts")
          import promote_release_image as promotion
          from release_image import registry_version_absent

          repository = "flowcool/ghostfolio-ibkr-sync"
          tag, version, candidate = "v3.2.1", "3.2.1", "v3.2.1-rc.1"
          commit = "9bc2cbd21094eb2707bdd6346177215c0e0a2166"
          digest = "sha256:ede44d526b7afd027e87c7f8de2b03d8b96a3f0e7b6b48e2c08aae37ab90a823"
          previous = "sha256:cbbd4450427d68535d3f66b894e2eb2a202c82f80a97d1835be83863faba85aa"
          image = "ghcr.io/" + repository
          record = dict(repository=repository, commit=commit, digest=digest, native={
              "amd64": "sha256:f9cac6756bda4e905c313cdfed8d2ed2871d94c4d805d9b5658c8ef6ea01f5f0",
              "arm64": "sha256:6b97b56bb7c214aecbc573c6d7b18bac574cc70897c9e9976dbf595d83de797b"})

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api(path):
              return json.loads(promotion.output("gh", "api", "repos/" + repository + path))

          require(os.environ["GITHUB_REPOSITORY"] == repository, "Repository mismatch")
          for name in (tag, candidate):
              require(promotion.output("git", "rev-parse", name + "^{commit}").decode().strip() == commit,
                      "Release source drift")
          subprocess.run(["git", "merge-base", "--is-ancestor", commit, "origin/main"], check=True)
          build = api("/actions/runs/40206240896")
          require(build["conclusion"] == "success" and build["head_sha"] == commit
                  and build["event"] == "release", "Signed native release checks missing")
          drafts = [r for r in api("/releases?per_page=20") if r.get("tag_name") == tag]
          require(len(drafts) == 1, "One prepared draft required")
          release = drafts[0]
          require(release["draft"] is True and release["prerelease"] is False
                  and release["published_at"] is None and release["target_commitish"] == commit
                  and "waived further lab admission" in release["body"], "Prepared waived draft required")
          previous_release = api("/releases/latest")
          require(previous_release["tag_name"] == "v3.2.0", "Current stable drift")
          raw = promotion.promote((tag, version, candidate, record), verify_only=True)
          promotion.same_digest(image + ":latest", previous)
          registry_version_absent(repository, version, os.environ["GITHUB_ACTOR"], os.environ["GH_TOKEN"])
          require(api("/releases/latest")["id"] == previous_release["id"], "Current stable changed")
          current_draft = api("/releases/" + str(release["id"]))
          require(all(current_draft.get(key) == release.get(key) for key in (
              "id", "tag_name", "target_commitish", "body", "name", "draft", "prerelease", "published_at")),
              "Prepared draft changed")
          proof = Path("tmp/security-patch-3.2.1")
          proof.mkdir(parents=True)
          state = dict(schema=1, **record, rc_tag=candidate, lab_admission="maintainer-waived",
                       empty="PASS; stopped", golden="not run; stopped", phase="version write pending")

          def save():
              (proof / "publication.json").write_text(json.dumps(state, indent=2) + "\n")

          save()
          subprocess.run(["docker", "buildx", "imagetools", "create", "--tag", image + ":" + version,
                          image + "@" + digest], check=True, timeout=120)
          promotion.same_digest(image + ":" + version, digest)
          (proof / "release-manifest.json").write_bytes(raw)
          state["phase"] = "release publication pending"
          save()
          # GITHUB_TOKEN publication does not dispatch the qualification-dependent release workflow.
          subprocess.run(["gh", "release", "edit", tag, "--repo", repository, "--draft=false", "--latest"],
                         check=True, timeout=90)
          require(api("/releases/latest")["tag_name"] == tag, "Published stable drift")
          promotion.same_digest(image + ":latest", previous)
          state["phase"] = "latest write pending"
          save()
          subprocess.run(["docker", "buildx", "imagetools", "create", "--tag", image + ":latest",
                          image + "@" + digest], check=True, timeout=120)
          promotion.same_digest(image + ":latest", digest)
          promotion.same_digest(image + ":" + version, digest)
          state.update(phase="complete", status="PASS")
          save()
          print("Published v3.2.1 and latest from the exact signed RC index; maintainer lab waiver recorded")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-patch-3.2.1-publication
          path: tmp/security-patch-3.2.1/*.json
          if-no-files-found: warn
