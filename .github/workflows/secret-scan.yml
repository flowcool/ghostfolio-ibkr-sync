name: Secret scan

# Blocks a PR that adds a credential-shaped string. GitHub secret scanning and
# push protection cover provider tokens; gitleaks adds generic patterns and a
# full-history weekly sweep. Rules and allowlist: .gitleaks.toml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "29 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      PUSH_AFTER: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Explicit commit range with every parent traversed. The gitleaks action
      # lists only the first 30 PR commits and follows first parents only.
      - name: Scan the introduced commits
        run: |
          set -euo pipefail
          range=""
          case "$EVENT_NAME" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
          esac
          echo "Scanning range: ${range:-full history}"
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --verbose --no-banner ${range:+--log-opts="$range"} /repo
