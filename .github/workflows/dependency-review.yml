name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep required checks visible; uncertain scope runs the full check.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            # Include old paths so moving code into docs still runs full checks.
            # GitHub lists at most 3,000 changed files. A boundary result stays full.
            if files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
              --jq '.[] | .filename, (.previous_filename // empty)'); then
              mapfile -t paths <<< "$files"
              if [ -n "$files" ] && [ "${#paths[@]}" -lt 3000 ]; then
                code=false
                for path in "${paths[@]}"; do
                  case "$path" in
                    docs/*|openspec/*|*.md|llms.txt) ;;
                    *) code=true; break ;;
                  esac
                done
              fi
            else
              echo "::warning::Changed files unavailable; running full validation"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  dependency-review:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
